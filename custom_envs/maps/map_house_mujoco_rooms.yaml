    area_m2: 60.8075
    center:
    - 3.9886
    - 10.0015
    bbox:
    - 0.05
    - 6.1
    - 7.9
    - 13.9
    polygon:
    - - 0.125
      - 13.875
    - - 0.075
      - 6.125
    - - 7.875
      - 6.125
    - - 7.875
      - 13.875
    neighbors:
    - room_0
    - room_2
    portals:
    - portal_1
    - portal_3
    entry_poses:
    - portal: portal_1
      pose:
      - 3.975
      - 6.825
      - 1.60109
    - portal: portal_3
      pose:
      - 7.125
      - 8.225
      - 3.113029
  room_2:
    label_value: 3
    area_m2: 61.02
    center:
    - 11.9813
    - 10.0086
    bbox:
    - 8.05
    - 6.1
    - 15.9
    - 13.9
    polygon:
    - - 8.075
      - 13.875
    - - 8.075
      - 6.125
    - - 15.875
      - 6.125
    - - 15.875
