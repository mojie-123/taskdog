seed: 42
device: cuda:0

dataset_root: custom_envs/scripts/FloAff/data/dataset_v1
run_root: custom_envs/scripts/FloAff/runs/floaff

data:
  train_role: axis_eval_floaff_train
  transfer_role: transfer_test
  validation_fraction: 0.20
  # XYZ and query coordinates are divided by this value before entering the
  # network. Labels and metric coordinates remain in their original units.
  spatial_scale_m: 2.0
  augmentation:
    jitter_std_m: 0.003
    dropout_probability: 0.03

model:
  hidden_dim: 256
  token_count: 512
  target_token_fraction: 0.25
  num_heads: 4
  scene_layers: 2
  query_layers: 1
  frequency_bands: 4
  dropout: 0.10

training:
  epochs: 150
  batch_size: 16
  num_workers: 4
  pin_memory: true
  learning_rate: 0.0002
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  dice_weight: 1.0
  amp: true
